# Core app-level translations
# Most UI elements have been moved to specialized files:
# - common.yml: Shared actions, status, positions, units, labels
# - tabs.yml: Tab navigation labels
# - gallery.yml: Image list/gallery
# - face_detection.yml: Face detection features
# - sticker.yml: Sticker storage
# - effects.yml: Border, mosaic, stroke
# - export.yml: Save format, quality, scale
# - settings.yml: Settings screen
# - laboratory.yml: Experimental features
# - theme_preview.yml: Theme preview UI
# - color.yml: Color grading/LUT
# - watermark.yml: Watermark settings
# - theme.yml: Theme names and config
# - fonts.yml: Font selection

_version: 2

app:
  # App name
  app_name:
    en: "Chama Optics"
    ko: "Chama Optics"
    ja: "Chama Optics"

  # File menu (EGUI desktop)
  file_menu:
    root:
      en: "File"
      ko: "파일"
      ja: "ファイル"
    quit:
      en: "Quit"
      ko: "종료"
      ja: "終了"

  # Open files (EGUI desktop)
  open_files:
    drag_drop:
      en: "Drag drop image here"
      ko: "여기에 이미지를 드래그&드롭"
      ja: "ここに画像をドラッグ＆ドロップ"
    button:
      en: "Add file"
      ko: "파일 추가"
      ja: "ファイルを追加"

  # Images list (EGUI desktop)
  images:
    list:
      en: "Images"
      ko: "사진 목록"
      ja: "画像一覧"
