  image_grouping:
    use_default:
      en: "Use default"
      ko: "기본값 사용"
      ja: "デフォルトを使用"
    prefix_label:
      en: "Prefix:"
      ko: "접두어:"
      ja: "プレフィックス:"
    postfix_label:
      en: "Postfix:"
      ko: "접미어:"
      ja: "サフィックス:"
    suggestion_hint:
      en: "Suggestion: %{suggestion}"
      ko: "제안: %{suggestion}"
      ja: "提案: %{suggestion}"
    ungrouped_label:
      en: "Ungrouped"
      ko: "그룹 없음"
