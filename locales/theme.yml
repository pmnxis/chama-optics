_version: 2

theme:
  selector:
    en: "Theme"
    ko: "테마"
    ja: "テーマ"
  settings:
    en: "Detail theme settings"
    ko: "상세 테마 설정"
    ja: "テーマの詳細設定"
  font_size:
    en: "Font size"
    ko: "폰트 사이즈"
    ja: "フォントサイズ"
  font_size_description:
    en: "The default font size is %{default}, and it is applied relative to this base value rather than in pixels."
    ko: "폰트 사이즈의 기본값은 %{default} 이며 px가 아닌 기본값에서 상대적인 크기로 적용됩니다."
    ja: "フォントサイズの基本値は %{default} であり、px ではなくこの基準値に対して相対的に適用されます。"
  # From here actual themes here
  nothing:
    en: "Nothing"
    ko: "효과 없음"
    ja: "なし"
  film:
    en: "Film"
    ko: "필름"
    ja: "フィルム"
  film_glow:
    en: "Film Glow"
    ko: "필름 글로우"
    ja: "フィルムグロー"
  film_date:
    en: "Film Date"
    ko: "필름 날짜"
    ja: "フィルム日付"

  just_frame:
    title:
      en: "Just frame"
      ko: "단순 프레임"
      ja: "単純余白"
    padding:
      en: "Frame padding"
      ko: "프레임 여백"
      ja: "フレーム余白"
    padding_description:
      en: "Adjust how much space to leave around the image."
      ko: "이미지 주변에 얼마나 여백을 둘지 설정합니다."
      ja: "画像の周囲にどのくらい余白を設けるかを設定します。"
    color:
      en: "Frame color"
      ko: "프레임 색상"
      ja: "フレームの色"
    padding_mode:
      label:
        en: "Padding mode"
        ko: "여백 모드"
        ja: "余白モード"
      absolute:
        en: "Absolute"
        ko: "절대값"
        ja: "固定値"
      absolute_hint:
        en: "Use a fixed padding value (e.g., 100px)."
        ko: "고정된 여백 크기(예: 100px)를 사용합니다."
        ja: "固定の余白値(例: 100px)を使用します。"
      relative:
        en: "Relative"
        ko: "상대값"
        ja: "相対値"
      relative_hint:
        en: "Scale padding relative to 2000px width (e.g., 100 → 100px at 2000px)."
        ko: "2000px 해상도를 기준으로 비례하여 여백이 조정됩니다 (예: 100 → 2000px 기준 100px)."
        ja: "2000pxの解像度を基準に余白が比例して調整されます(例: 100 → 2000pxで100px)。"

  strap:
    title:
      en: "Strap"
      ko: "스트랩"
      ja: "ストラップ"

  date_config:
    date_font_select:
      en: "Select date font"
      ko: "날짜 폰트 선택"
      ja: "日付選択"

  # Some config
  film_config:
    glow:
      en: "Glow effect"
      ko: "글로우 효과"
      ja: "グロー効果"
    glow_range:
      en: "Glow range"
      ko: "글로우 범위"
      ja: "グロー範囲"
    hide_camera_exif:
      label:
        en: "Hide Camera & Lens Info"
        ko: "카메라 및 렌즈 정보 숨기기"
        ja: "カメラとレンズ情報を非表示にする"
      description:
        en: "Hides the camera model and lens information from EXIF data when displaying photos."
        ko: "사진을 표시할 때 EXIF 데이터의 카메라 기종과 렌즈 정보를 숨깁니다."
        ja: "写真表示時にEXIFデータ内のカメラ機種とレンズ情報を非表示にします。"

