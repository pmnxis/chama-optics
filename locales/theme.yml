    hint:
      en: "Adjusts the vertical scaling ratio of the font relative to its base size."
      ko: "폰트의 기본 크기에 대해 세로 비율을 조정합니다."
      ja: "フォントの基準サイズに対して縦方向の比率を調整します。"

  template_format_hint:
    title:
      en: "About Template Format"
      ko: "탬플릿 문자열에 관하여"
      ja: "フィールド名に関して"
    description:
      en: |
        You can customize how EXIF info is shown using `{}` placeholders.  
        Each `{key}` will be replaced with the corresponding value from the photo’s metadata.  
        If the value is empty or missing, the entire block wrapped in `[...]` will be hidden automatically.

        **Example:**
        ```
        [ISO{iso_speed}] [{focal}mm] [F{fnumber}] [{exposure}s]
        ```

        - If `iso_speed = 200`, `focal = "35"`, `fnumber = "1.8"`, `exposure = "1/125"`,  
          → **Result:** `ISO200 35mm F1.8 1/125s`
        - If `focal` is empty,  
          → **Result:** `ISO200 F1.8 1/125s` (the `[ {focal}mm ]` part is skipped)

      ko: |
        `{}` 안에 EXIF 필드 이름을 입력하면 자동으로 값이 치환됩니다.  
        해당 값이 비어 있거나 존재하지 않으면, `[...]`로 감싼 부분 전체가 표시되지 않습니다.

        **예시:**
        ```
        [ISO{iso_speed}] [{focal}mm] [F{fnumber}] [{exposure}s]
        ```

        - `iso_speed = 200`, `focal = "35"`, `fnumber = "1.8"`, `exposure = "1/125"` 일 때  
          → **결과:** `ISO200 35mm F1.8 1/125s`
        - `focal` 값이 없을 경우  
          → **결과:** `ISO200 F1.8 1/125s` (`[{focal}mm]` 전체가 숨겨짐)

      ja: |
        `{}` 内に EXIF フィールド名を入力すると、その値が自動的に置き換えられます。  
        値が空または存在しない場合、対応する `[...]` ブロック全体が非表示になります。

        **例:**
        ```
        [ISO{iso_speed}] [{focal}mm] [F{fnumber}] [{exposure}s]
        ```

        - `iso_speed = 200`, `focal = "35"`, `fnumber = "1.8"`, `exposure = "1/125"` の場合  
          → **結果:** `ISO200 35mm F1.8 1/125s`
        - `focal` が空の場合  
          → **結果:** `ISO200 F1.8 1/125s` (`[{focal}mm]` ブロックは表示されません)
