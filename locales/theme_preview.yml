# Theme Preview translations
# Used in both EGUI (desktop) and iOS theme preview

_version: 2

theme_preview:
  # Image selection
  select_image:
    en: "Select an image to preview:"
    ko: "미리보기할 이미지를 선택하세요:"
    ja: "プレビューする画像を選択してください:"
  select_image_mobile:
    en: "Select an image to preview"
    ko: "미리보기할 이미지를 선택하세요"
    ja: "プレビューする画像を選択してください"
  change_photo:
    en: "Change Photo"
    ko: "사진 변경"
    ja: "写真を変更"
  select_image_hint:
    en: "Select an image from the gallery above"
    ko: "위의 갤러리에서 이미지를 선택하세요"
    ja: "上のギャラリーから画像を選択してください"

  # Preview label
  preview_label:
    en: "Theme Preview"
    ko: "테마 미리보기"
    ja: "テーマプレビュー"

  # Status messages
  generating:
    en: "Generating preview..."
    ko: "미리보기 생성 중..."
    ja: "プレビューを生成しています..."
  preview_placeholder:
    en: "Theme preview will be shown here"
    ko: "테마 미리보기가 여기에 표시됩니다"
    ja: "テーマプレビューがここに表示されます"
  no_images:
    en: "Load images from the Image List tab to preview themes"
    ko: "이미지 리스트 탭에서 사진을 불러오면 테마 미리보기를 볼 수 있습니다"
    ja: "画像リストタブから画像を読み込むとテーマをプレビューできます"

  # Theme settings
  theme_settings:
    en: "Theme Parameters"
    ko: "테마 파라미터"
    ja: "テーマパラメータ"

  # Refresh
  refresh_button:
    en: "Refresh Preview"
    ko: "미리보기 새로고침"
    ja: "プレビュー更新"

  # Status
  status_ready:
    en: "Ready"
    ko: "준비 완료"
    ja: "準備完了"
  error_loading:
    en: "Failed to load image data"
    ko: "이미지 데이터 로드 실패"
    ja: "画像データの読み込みに失敗"
  error_decoding:
    en: "Failed to decode image"
    ko: "이미지 디코딩 실패"
    ja: "画像のデコードに失敗"
  image_loaded:
    en: "Image loaded"
    ko: "이미지 로드됨"
    ja: "画像が読み込まれました"
  error_prefix:
    en: "Error: "
    ko: "오류: "
    ja: "エラー: "

  # Theme status
  no_theme_applied:
    en: "No theme applied (Nothing selected)"
    ko: "테마 적용 안됨 (Nothing 선택됨)"
    ja: "テーマ適用なし（Nothing選択中）"
  theme_applied:
    en: "Theme applied!"
    ko: "테마 적용됨!"
    ja: "テーマ適用完了！"
  output_not_created:
    en: "Output file not created"
    ko: "출력 파일 생성 안됨"
    ja: "出力ファイルが作成されませんでした"
  theme_failed:
    en: "Theme application failed"
    ko: "테마 적용 실패"
    ja: "テーマ適用に失敗"
  theme_with_value:
    en: "Theme: %@"
    ko: "테마: %@"
    ja: "テーマ：%@"
  date_with_value:
    en: "Date: %@"
    ko: "날짜: %@"
    ja: "日付：%@"
