# Theme Preview translations
# Used in both EGUI (desktop) and iOS theme preview

_version: 2

theme_preview:
  # Image selection
  select_image:
    en: "Select an image to preview:"
    ko: "미리보기할 이미지를 선택하세요:"
    ja: "プレビューする画像を選択してください:"
    id: "Pilih gambar untuk pratinjau:"
  select_image_mobile:
    en: "Select an image to preview"
    ko: "미리보기할 이미지를 선택하세요"
    ja: "プレビューする画像を選択してください"
    id: "Pilih gambar untuk pratinjau"
  change_photo:
    en: "Change Photo"
    ko: "사진 변경"
    ja: "写真を変更"
    id: "Ganti Foto"
  select_image_hint:
    en: "Select an image from the gallery above"
    ko: "위의 갤러리에서 이미지를 선택하세요"
    ja: "上のギャラリーから画像を選択してください"
    id: "Pilih gambar dari galeri di atas"

  # Preview label
  preview_label:
    en: "Theme Preview"
    ko: "테마 미리보기"
    ja: "テーマプレビュー"
    id: "Pratinjau Tema"

  # Status messages
  generating:
    en: "Generating preview..."
    ko: "미리보기 생성 중..."
    ja: "プレビューを生成しています..."
    id: "Membuat pratinjau..."
  preview_placeholder:
    en: "Theme preview will be shown here"
    ko: "테마 미리보기가 여기에 표시됩니다"
    ja: "テーマプレビューがここに表示されます"
