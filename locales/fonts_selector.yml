_version: 2

fonts_selector:
  select_a_font:
    en: "Select a font"
    ko: "폰트 선택"
    ja: "フォントを選択"
  variable_fonts:
    en: "↔ Variable Fonts"
    ko: "↔ 프로그램 내장 가변폭 폰트"
    ja: "↔ 内蔵可変フォント"
  builtin_fonts:
    en: "⛶ Built-in Fonts"
    ko: "⛶ 프로그램 내장 폰트"
    ja: "⛶ 内蔵フォント"
  system_fonts:
    en: "💻 System Fonts"
    ko: "💻 시스템 폰트"
    ja: "💻 システムフォント"
  system_fonts_loading:
    en: "⏳ Loading system fonts..."
    ko: "⏳ 시스템 폰트 로딩중..."
    ja: "⏳ システムフォントを読み込み中..."
  default:
    en: "Default"
    ko: "기본값"
    ja: "デフォルト"
  variable:
    label:
      en: "Variable"
      ko: "가변폭"
      ja: "可変冷"
    hint:
      en: "A variable font built into the program that allows fine-grained adjustment of weight and width."
      ko: "프로그램 내장 가변폭 폰트로, 글씨 굵기와 폭을 세세하게 조절할 수 있습니다."
      ja: "プログラム内蔵の可変フォントで、文字の太さや幅を細かく調整できます。"

  others:
    label:
      en: "Standard"
      ko: "기본형"
      ja: "標準冷"
    hint:
      en: "A standard font that is either built into the program or provided by the operating system."
      ko: "프로그램 내장 또는 운영체제에 내장된 일반 폰트를 선택할 수 있습니다."
      ja: "プログラム内蔵またはOSに搭載されている標準フォントを選択できます。"

text_align:
  bottom_text_align:
    en: "Bottom Text Align"
    ko: "하단 텍스트 정렬"
    ja: "下段テキスト揃え"
  top_text_align:
    en: "Top Text Align"
    ko: "상단 텍스트 정렬"
    ja: "上段テキスト揃え"

  left:
    en: "Left Align"
    ko: "왼쪽 정렬"
    ja: "左揃え"
