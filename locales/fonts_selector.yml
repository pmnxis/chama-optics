    en: "Align text to the left"
    ko: "텍스트를 왼쪽으로 정렬합니다."
    ja: "テキストを左側に揃えます。"

  center:
    en: "Center Align"
    ko: "가운데 정렬"
    ja: "中央揃え"
  center_hint:
    en: "Align text to the center"
    ko: "텍스트를 가운데로 정렬합니다."
    ja: "テキストを中央に揃えます。"

  right:
