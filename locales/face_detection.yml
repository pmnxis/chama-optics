# Face Detection translations
# Merged from detection.yml and face_detection.yml
# Used in both EGUI (desktop) and iOS face detection features

_version: 2

face_detection:
  # Main labels
  title:
    en: "Face Detection"
    ko: "얼굴 인식"
    ja: "顔認識"
  label:
    en: "Face detection config"
    ko: "얼굴 감지 설정"
    ja: "顔検出設定"

  # Image selection
  select_image:
    en: "Select image"
    ko: "이미지 선택"
    ja: "画像選択"
  select_image_first:
    en: "Select an image to preview"
    ko: "미리보기할 이미지를 선택하세요"
    ja: "プレビューする画像を選択してください"
  no_images:
    en: "No images loaded. Go to Image List tab to add images."
    ko: "이미지가 로드되지 않았습니다. 이미지 리스트 탭으로 이동하여 이미지를 추가하세요."
    ja: "画像が読み込まれていません。画像リストタブに移動して画像を追加してください。"
  no_images_short:
    en: "No images"
    ko: "이미지 없음"
    ja: "画像なし"

  # Detection actions
  detect_faces:
    en: "Detect Faces"
    ko: "얼굴 감지"
    ja: "顔検出"
  detect_faces_button:
    en: "Detect Faces (%@)"
    ko: "얼굴 감지 (%@)"
    ja: "顔を検出（%@）"
  clear_all:
    en: "Clear All"
    ko: "전체 삭제"
    ja: "すべてクリア"
  reset_view:
    en: "Reset view"
    ko: "보기 초기화"
    ja: "表示をリセット"

  # Detection results
  faces_found:
    en: "face(s) found"
    ko: "개 얼굴 발견"
    ja: "件の顔が見つかりました"
  faces_found_format:
    en: "%d face(s) detected"
    ko: "%d개 얼굴 감지됨"
    ja: "%d個の顔を検出"
  no_faces:
    en: "No faces detected yet. Click 'Detect Faces' to start."
    ko: "아직 인식된 얼굴이 없습니다. '얼굴 인식'을 클릭하여 시작하세요."
    ja: "まだ顔が認識されていません。「顔認識」をクリックして開始してください。"
  no_faces_short:
    en: "No faces"
    ko: "얼굴 없음"
    ja: "顔なし"
  no_faces_in_image:
    en: "No faces detected in image"
    ko: "이미지에서 감지된 얼굴이 없습니다"
    ja: "画像で検出された顔がありません"

