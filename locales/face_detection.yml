  faces_and_stickers:
    en: "Faces & Stickers"
    ko: "얼굴 & 스티커"
    ja: "顔＆ステッカー"
  face_label_format:
    en: "Face #%{n1} (%{n2}x%{n3})"
    ko: "얼굴 #%{n1} (%{n2}x%{n3})"
    ja: "顔 #%{n1} (%{n2}x%{n3})"
  face_number:
    en: "Face #%d"
    ko: "얼굴 #%d"
    ja: "顔 #%d"
  selected_face:
    en: "Selected Face #%{n}"
    ko: "선택된 얼굴 #%{n}"
    ja: "選択された顔 #%{n}"
  no_face_selected:
    en: "No face selected"
    ko: "얼굴 선택되지 않음"
    ja: "顔が選択されていません"
  position_format:
    en: "Pos: (%d, %d)"
    ko: "위치: (%d, %d)"
    ja: "位置：(%d, %d)"
  size_format:
    en: "Size: %d x %d"
    ko: "크기: %d x %d"
    ja: "サイズ：%d x %d"
  edit_faces:
    en: "Edit Faces"
    ko: "얼굴 편집"
    ja: "顔を編集"
  add_face:
    en: "Add Face"
    ko: "얼굴 추가"
    ja: "顔を追加"

  # Sticker assignment
  assign_sticker:
    en: "Sticker:"
    ko: "스티커:"
    ja: "ステッカー:"
  sticker_hint:
    en: "Add stickers in Sticker tab"
    ko: "스티커 탭에서 스티커를 추가하세요"
    ja: "スティッカータブでステッカーを追加してください"
  tap_face_to_assign_sticker:
    en: "Tap a face to assign a sticker"
    ko: "스티커를 할당하려면 얼굴을 탭하세요"
    ja: "ステッカーを割り当てるには顔をタップしてください"
  sticker_with_name:
    en: "Sticker: %@"
    ko: "스티커: %@"
    ja: "ステッカー：%@"
  no_sticker_available:
    en: "No sticker available"
    ko: "스티커 없음"
    ja: "ステッカーなし"
  no_sticker_assigned:
    en: "No sticker assigned"
    ko: "스티커 할당 안됨"
    ja: "ステッカーが割り当てられていません"

  # Detection engine config
  detail_of_detection_engine:
    en: "Detail of face detection engine"
    ko: "얼굴 감지 엔진 설정"
    ja: "検出エンジン詳細設定"
  detection_engine:
    en: "Detection Engine"
    ko: "감지 엔진"
    ja: "検出エンジン"
  engine:
    en: "Engine"
    ko: "엔진"
    ja: "エンジン"

