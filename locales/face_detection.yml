  faces_and_stickers:
    en: "Faces & Stickers"
    ko: "얼굴 & 스티커"
    ja: "顔＆ステッカー"
    id: "Wajah & Stiker"
  face_label_format:
    en: "Face #%{n1} (%{n2}x%{n3})"
    ko: "얼굴 #%{n1} (%{n2}x%{n3})"
    ja: "顔 #%{n1} (%{n2}x%{n3})"
    id: "Wajah #%{n1} (%{n2}x%{n3})"
  face_number:
    en: "Face #%d"
    ko: "얼굴 #%d"
    ja: "顔 #%d"
    id: "Wajah #%d"
  face_number_simple:
    en: "Face #%d"
    ko: "얼굴 #%d"
    ja: "顔 #%d"
    id: "Wajah #%d"
  selected_face:
    en: "Selected Face #%{n}"
    ko: "선택된 얼굴 #%{n}"
    ja: "選択された顔 #%{n}"
    id: "Wajah Terpilih #%{n}"
  no_face_selected:
    en: "No face selected"
    ko: "얼굴 선택되지 않음"
    ja: "顔が選択されていません"
    id: "Tidak ada wajah dipilih"
  position_format:
    en: "Pos: (%d, %d)"
    ko: "위치: (%d, %d)"
    ja: "位置：(%d, %d)"
    id: "Pos: (%d, %d)"
  size_format:
    en: "Size: %d x %d"
    ko: "크기: %d x %d"
    ja: "サイズ：%d x %d"
    id: "Ukuran: %d x %d"
  edit_faces:
    en: "Edit Faces"
    ko: "얼굴 편집"
    ja: "顔を編集"
    id: "Sunting Wajah"
  add_face:
    en: "Add Face"
    ko: "얼굴 추가"
    ja: "顔を追加"
    id: "Tambah Wajah"

  # Sticker assignment
  assign_sticker:
    en: "Sticker:"
    ko: "스티커:"
    ja: "ステッカー:"
    id: "Stiker:"
  sticker_hint:
    en: "Add stickers in Sticker tab"
    ko: "스티커 탭에서 스티커를 추가하세요"
    ja: "スティッカータブでステッカーを追加してください"
    id: "Tambahkan stiker di tab Stiker"
  tap_face_to_assign_sticker:
    en: "Tap a face to assign a sticker"
    ko: "스티커를 할당하려면 얼굴을 탭하세요"
    ja: "ステッカーを割り当てるには顔をタップしてください"
    id: "Ketuk wajah untuk menetapkan stiker"
  sticker_with_name:
    en: "Sticker: %@"
    ko: "스티커: %@"
    ja: "ステッカー：%@"
    id: "Stiker: %@"
  no_sticker_available:
    en: "No sticker available"
    ko: "스티커 없음"
    ja: "ステッカーなし"
    id: "Tidak ada stiker tersedia"
  no_sticker_assigned:
    en: "No sticker assigned"
    ko: "스티커 할당 안됨"
    ja: "ステッカーが割り当てられていません"
    id: "Tidak ada stiker ditetapkan"

