    ko: "얼굴 감지 편집기"
    ja: "顔検出エディタ"
    id: "Editor Deteksi Wajah"
  select_photo:
    en: "Select Photo"
    ko: "사진 선택"
    ja: "写真を選択"
    id: "Pilih Foto"
