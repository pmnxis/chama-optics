  speed_mode:
    en: "Speed Mode"
    ko: "속도 모드"
    ja: "速度モード"
    id: "Mode Kecepatan"
  speed_mode_hint:
    en: "Balance between speed and accuracy (affects processing depth)"
    ko: "속도와 정확도 사이의 균형 (처리 깊이에 영향)"
    ja: "速度と精度のバランス（処理深度に影響）"
    id: "Keseimbangan antara kecepatan dan akurasi (mempengaruhi kedalaman pemrosesan)"
  speed_mode_fastest:
    en: "Fastest (Single or two-person photo)"
    ko: "최고속 (단독/두명 있는 사진)"
    ja: "最速（1人または2人の写真）"
    id: "Tercepat (Foto satu atau dua orang)"
  speed_mode_fast:
    en: "Fast (3-4 people in unusual aspect ratio photo)"
    ko: "빠름 (종횡비가 특이한 사진에서 3-4명 있는 사진)"
    ja: "高速（縦横比が特殊な写真に3～4人）"
    id: "Cepat (3-4 orang dalam foto rasio aspek tidak biasa)"
  speed_mode_normal:
    en: "Normal (Group photo with 10+ people)"
    ko: "보통 (10명 이상의 사진)"
    ja: "標準（10人以上の写真）"
    id: "Normal (Foto kelompok dengan 10+ orang)"
  speed_mode_slow:
    en: "Slow (Group photo with 40-50 people)"
    ko: "느림 (40~50명의 단체사진)"
    ja: "低速（40～50人の団体写真）"
    id: "Lambat (Foto kelompok dengan 40-50 orang)"
  speed_mode_slowest:
    en: "Slowest (Group photo with 50-100 people)"
    ko: "가장느림 (50~100명의 단체사진)"
    ja: "最低速（50～100人の団体写真）"
    id: "Paling Lambat (Foto kelompok dengan 50-100 orang)"

  # Execution provider
  execution_provider:
    en: "Execution provider"
    ko: "실행 제공자"
    ja: "実行プロバイダー"
    id: "Penyedia eksekusi"
  execution_provider_hint:
    en: "Hardware acceleration backend (CPU/OnnxAuto/CoreML)"
    ko: "하드웨어 가속 백엔드 (CPU/OnnxAuto/CoreML)"
    ja: "ハードウェアアクセラレーションバックエンド（CPU/OnnxAuto/CoreML）"
    id: "Backend akselerasi perangkat keras (CPU/OnnxAuto/CoreML)"
  provider_cpu:
    en: "CPU (universal)"
    ko: "CPU (호환성 좋음)"
    ja: "CPU（互換性あり）"
    id: "CPU (universal)"
  provider_onnx_auto:
    en: "OnnxAuto (auto-detect)"
    ko: "OnnxAuto (자동 감지)"
    ja: "OnnxAuto（自動検出）"
    id: "OnnxAuto (deteksi otomatis)"
  provider_coreml:
    en: "CoreML (Apple Silicon)"
    ko: "CoreML (Apple Silicon)"
    ja: "CoreML (Apple Silicon)"
    id: "CoreML (Apple Silicon)"

