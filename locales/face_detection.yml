  recursive_detection:
    en: "Recursive face detection"
    ko: "재귀적 얼굴 감지"
    ja: "再帰的顔検出"
    id: "Deteksi wajah rekursif"
  recursive_min_size:
    en: "Minimum region size"
    ko: "최소 영역 크기"
    ja: "最小領域サイズ"
    id: "Ukuran wilayah minimum"
  recursive_min_size_hint:
    en: "Minimum size of a region to search recursively (32-256 pixels)"
    ko: "재귀적으로 검색할 영역의 최소 크기 (32-256 픽셀)"
    ja: "再帰的に検索する領域の最小サイズ（32-256ピクセル）"
    id: "Ukuran minimum wilayah untuk pencarian rekursif (32-256 piksel)"
  recursive_overlap:
    en: "Overlap search"
    ko: "중복 검색"
    ja: "重複検索"
    id: "Pencarian tumpang tindih"
  recursive_overlap_ratio:
    en: "Overlap ratio"
    ko: "중복 비율"
    ja: "重複比率"
    id: "Rasio tumpang tindih"
  recursive_overlap_ratio_hint:
    en: "Overlap percentage for region division (0-50%)"
    ko: "영역 분할 시 중복 퍼센트 (0-50%)"
    ja: "領域分割時の重複パーセンテージ（0-50%）"
    id: "Persentase tumpang tindih untuk pembagian wilayah (0-50%)"

  # Mask/blur settings
  mask_faces:
    en: "Mask faces (blur)"
    ko: "얼굴 마스킹 (블러)"
    ja: "顔をマスキング（ぼかし）"
    id: "Tutupi wajah (blur)"
  mask_blur_radius:
    en: "Blur radius"
    ko: "블러 반경"
    ja: "ぼかし半径"
    id: "Radius blur"
  mask_blur_radius_hint:
    en: "Strength of the blur effect applied to detected faces (1-100 pixels)"
    ko: "감지된 얼굴에 적용할 블러 효과의 강도 (1-100 픽셀)"
    ja: "検出された顔に適用するぼかし効果の強度（1-100ピクセル）"
    id: "Kekuatan efek blur yang diterapkan pada wajah terdeteksi (1-100 piksel)"

  # Border settings
  border_thickness:
    en: "Border thickness"
    ko: "테두리 두께"
    ja: "枠線の太さ"
    id: "Ketebalan bingkai"
  border_thickness_hint:
    en: "Thickness of the face detection rectangle border in pixels"
    ko: "얼굴 감지 사각형 테두리의 두께 (픽셀 단위)"
    ja: "顔検出矩形の枠線の太さ（ピクセル単位）"
    id: "Ketebalan bingkai persegi panjang deteksi wajah dalam piksel"

  # Face detection editor (iOS)
  face_detection_editor:
