# Face Detection translations
# Merged from detection.yml and face_detection.yml
# Used in both EGUI (desktop) and iOS face detection features

_version: 2

face_detection:
  # Main labels
  title:
    en: "Face Detection"
    ko: "얼굴 인식"
    ja: "顔認識"
    id: "Deteksi Wajah"
  label:
    en: "Face detection config"
    ko: "얼굴 감지 설정"
    ja: "顔検出設定"
    id: "Konfigurasi deteksi wajah"

  # Default effect selector
  default_effect:
    en: "Default Effect"
    ko: "기본 효과"
    ja: "デフォルトエフェクト"
    id: "Efek Bawaan"

  # Image selection
  select_image:
    en: "Select image"
    ko: "이미지 선택"
    ja: "画像選択"
    id: "Pilih gambar"
  select_image_first:
    en: "Select an image to preview"
    ko: "미리보기할 이미지를 선택하세요"
    ja: "プレビューする画像を選択してください"
    id: "Pilih gambar untuk pratinjau"
  no_images:
    en: "No images loaded. Go to Image List tab to add images."
    ko: "이미지가 로드되지 않았습니다. 이미지 리스트 탭으로 이동하여 이미지를 추가하세요."
    ja: "画像が読み込まれていません。画像リストタブに移動して画像を追加してください。"
    id: "Tidak ada gambar dimuat. Buka tab Daftar Gambar untuk menambahkan gambar."
  no_images_short:
    en: "No images"
    ko: "이미지 없음"
    ja: "画像なし"
    id: "Tidak ada gambar"
  preview:
    en: "Preview"
    ko: "미리보기"
    ja: "プレビュー"
    id: "Pratinjau"

  # Detection actions
  detect_faces:
    en: "Detect Faces"
    ko: "얼굴 감지"
    ja: "顔検出"
    id: "Deteksi Wajah"
  detect_faces_button:
    en: "Detect Faces (%@)"
    ko: "얼굴 감지 (%@)"
    ja: "顔を検出（%@）"
    id: "Deteksi Wajah (%@)"
  clear_all:
    en: "Clear All"
    ko: "전체 삭제"
    ja: "すべてクリア"
    id: "Hapus Semua"
  reset_view:
    en: "Reset view"
    ko: "보기 초기화"
    ja: "表示をリセット"
    id: "Atur ulang tampilan"

  # Detection results
  faces_found:
    en: "face(s) found"
    ko: "개 얼굴 발견"
    ja: "件の顔が見つかりました"
    id: "wajah ditemukan"
  faces_found_format:
    en: "%d face(s) detected"
    ko: "%d개 얼굴 감지됨"
    ja: "%d個の顔を検出"
    id: "%d wajah terdeteksi"
  no_faces:
    en: "No faces detected yet. Click 'Detect Faces' to start."
    ko: "아직 인식된 얼굴이 없습니다. '얼굴 인식'을 클릭하여 시작하세요."
    ja: "まだ顔が認識されていません。「顔認識」をクリックして開始してください。"
    id: "Belum ada wajah terdeteksi. Klik 'Deteksi Wajah' untuk memulai."
  no_faces_short:
    en: "No faces"
    ko: "얼굴 없음"
    ja: "顔なし"
    id: "Tidak ada wajah"
  no_faces_in_image:
    en: "No faces detected in image"
    ko: "이미지에서 감지된 얼굴이 없습니다"
    ja: "画像で検出された顔がありません"
    id: "Tidak ada wajah terdeteksi dalam gambar"

