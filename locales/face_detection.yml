  execution_provider:
    en: "Execution provider"
    ko: "실행 제공자"
    ja: "実行プロバイダー"
  execution_provider_hint:
    en: "Hardware acceleration backend (CPU/OnnxAuto/CoreML)"
    ko: "하드웨어 가속 백엔드 (CPU/OnnxAuto/CoreML)"
    ja: "ハードウェアアクセラレーションバックエンド（CPU/OnnxAuto/CoreML）"
  provider_cpu:
    en: "CPU (universal)"
    ko: "CPU (호환성 좋음)"
    ja: "CPU（互換性あり）"
  provider_onnx_auto:
    en: "OnnxAuto (auto-detect)"
    ko: "OnnxAuto (자동 감지)"
    ja: "OnnxAuto（自動検出）"
  provider_coreml:
    en: "CoreML (Apple Silicon)"
    ko: "CoreML (Apple Silicon)"
    ja: "CoreML (Apple Silicon)"

  # Recursive detection
  recursive_detection:
    en: "Recursive face detection"
    ko: "재귀적 얼굴 감지"
    ja: "再帰的顔検出"
  recursive_min_size:
    en: "Minimum region size"
    ko: "최소 영역 크기"
    ja: "最小領域サイズ"
  recursive_min_size_hint:
    en: "Minimum size of a region to search recursively (32-256 pixels)"
    ko: "재귀적으로 검색할 영역의 최소 크기 (32-256 픽셀)"
    ja: "再帰的に検索する領域の最小サイズ（32-256ピクセル）"
  recursive_overlap:
    en: "Overlap search"
    ko: "중복 검색"
    ja: "重複検索"
  recursive_overlap_ratio:
    en: "Overlap ratio"
    ko: "중복 비율"
    ja: "重複比率"
  recursive_overlap_ratio_hint:
    en: "Overlap percentage for region division (0-50%)"
    ko: "영역 분할 시 중복 퍼센트 (0-50%)"
    ja: "領域分割時の重複パーセンテージ（0-50%）"

