name: Cache Logo Assets

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  download-logos:
    name: Download and cache logo assets
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore existing logo assets cache
        id: cache-logo-restore
        uses: actions/cache/restore@v4
        with:
          path: assets/download
          key: logo-assets-${{ hashFiles('assets/logo_mnf.csv') }}
          restore-keys: |
            logo-assets-

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Install libheif dependencies (macOS)
        run: |
          brew update
          brew install libheif pkg-config

      - name: Download logo assets (via build.rs)
        continue-on-error: true
        run: |
          # This will trigger build.rs which downloads logos to assets/download
          # Even if it fails, we'll save whatever was downloaded
          echo "Starting logo download..."
          cargo fetch || true
          cargo build --release 2>&1 | tee build.log || echo "Build failed, but continuing to save cache"

      - name: Verify downloads
        if: always()
        run: |
          echo "=== Download Status ==="
          if [ -d "assets/download" ]; then
            echo "Directory exists: assets/download"
            echo ""
            echo "Total files downloaded:"
            find assets/download -type f 2>/dev/null | wc -l || echo "0"
            echo ""
            echo "Files list:"
            ls -lah assets/download/ | head -20
            echo ""
            echo "Total size:"
            du -sh assets/download/ 2>/dev/null || echo "N/A"
          else
            echo "Directory not found: assets/download"
          fi

      - name: Save logo assets cache (ALWAYS)
        if: always() && steps.cache-logo-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: assets/download
          key: logo-assets-${{ hashFiles('assets/logo_mnf.csv') }}-${{ github.run_number }}-${{ github.run_attempt }}

      - name: Upload partial downloads as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logo-download-attempt-${{ github.run_id }}
          path: |
            assets/download/
            build.log
          retention-days: 3

