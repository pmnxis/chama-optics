on:
  push:
    branches-ignore:
      - 'web'
    tags-ignore:
      - 'web/**'
  pull_request:
  workflow_dispatch:

name: CI

env:
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  release_job:
    name: Create release
    runs-on: macos-15
    if: startsWith(github.ref, 'refs/tags/v')
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      release_id: ${{ steps.create_release.outputs.id }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: '0'
    - name: Install kokai
      run: cargo install kokai
    - name: Make changelog
      run: kokai release --ref ${{ github.ref }} > changes
    - name: Create release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        draft: true
        body_path: ./changes

  check:
    name: Check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Restore logo assets cache
        id: cache-logo-restore
        uses: actions/cache/restore@v4
        with:
          path: assets/download
          key: logo-assets-${{ hashFiles('assets/logo_mnf.csv') }}-complete
          restore-keys: |
            logo-assets-
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: 1.92
          override: true
      - name: Force zune-jpeg version to avoid 0.5.6 bug
        run: cargo update -p zune-jpeg:0.5.6 --precise 0.5.8 || true
      - uses: actions-rs/cargo@v1
        with:
          command: check
          args: --features desktop,face_detection_insightface
      - name: Check spelling of entire workspace
        uses: crate-ci/typos@master
      - name: Save logo assets cache
        if: always() && steps.cache-logo-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: assets/download
          key: logo-assets-${{ hashFiles('assets/logo_mnf.csv') }}-complete

  test:
    name: Test Suite
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Restore logo assets cache
        id: cache-logo-restore
        uses: actions/cache/restore@v4
        with:
          path: assets/download
          key: logo-assets-${{ hashFiles('assets/logo_mnf.csv') }}-complete
          restore-keys: |
            logo-assets-
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: 1.92
          override: true
      - name: Force zune-jpeg version to avoid 0.5.6 bug
        run: cargo update -p zune-jpeg:0.5.6 --precise 0.5.8 || true
      - uses: actions-rs/cargo@v1
        with:
          command: test
          args: --features desktop
      - name: Save logo assets cache
        if: always() && steps.cache-logo-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: assets/download
          key: logo-assets-${{ hashFiles('assets/logo_mnf.csv') }}-complete

  fmt:
    name: Rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Restore logo assets cache
        id: cache-logo-restore
        uses: actions/cache/restore@v4
        with:
          path: assets/download
          key: logo-assets-${{ hashFiles('assets/logo_mnf.csv') }}-complete
          restore-keys: |
            logo-assets-
      - name: Install libheif dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:strukturag/libheif
          sudo apt-get install -y libheif-dev libde265-dev libx265-dev libjpeg-dev libpng-dev libaom-dev libssl-dev
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: 1.92
          override: true
          components: rustfmt
      - name: Force zune-jpeg version to avoid 0.5.6 bug
        run: cargo update -p zune-jpeg:0.5.6 --precise 0.5.8 || true
      - uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: --all -- --check
      - name: Save logo assets cache
        if: always() && steps.cache-logo-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: assets/download
          key: logo-assets-${{ hashFiles('assets/logo_mnf.csv') }}-complete

  clippy:
    name: Clippy
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Restore logo assets cache
        id: cache-logo-restore
        uses: actions/cache/restore@v4
        with:
          path: assets/download
          key: logo-assets-${{ hashFiles('assets/logo_mnf.csv') }}-complete
          restore-keys: |
            logo-assets-
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: 1.92
          override: true
          components: clippy
      - name: Force zune-jpeg version to avoid 0.5.6 bug
        run: cargo update -p zune-jpeg:0.5.6 --precise 0.5.8 || true
      - uses: actions-rs/cargo@v1
        with:
          command: clippy
          args: --features desktop,face_detection_insightface -- -D warnings
      - name: Save logo assets cache
        if: always() && steps.cache-logo-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: assets/download
          key: logo-assets-${{ hashFiles('assets/logo_mnf.csv') }}-complete

  build_job:
    name: Build release
    # commend `needs: release_job` when you test ci/cd
    needs: release_job
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-15
          TARGET: aarch64-apple-darwin

        # - os: macos-15
        #   TARGET: x86_64-apple-darwin

        # - os: ubuntu-24.04
        #   TARGET: x86_64-unknown-linux-gnu

        - os: windows-2022
          TARGET: x86_64-pc-windows-msvc
          EXTENSION: .exe

    steps:
    - uses: actions/checkout@v4
    - name: Restore logo assets cache
      id: cache-logo-restore
      uses: actions/cache/restore@v4
      with:
        path: assets/download
        key: logo-assets-${{ hashFiles('assets/logo_mnf.csv') }}-complete
        restore-keys: |
          logo-assets-
    - uses: ilammy/setup-nasm@v1
    - name: Building ${{ matrix.TARGET }}
      run: echo "${{ matrix.TARGET }}"

    # Force zune-jpeg version before building
    - name: Force zune-jpeg version to avoid 0.5.6 bug
      run: cargo update -p zune-jpeg:0.5.6 --precise 0.5.8 || true

    # macOS
    - name: Install cargo bundle
      run: cargo install cargo-bundle
      if: matrix.os == 'macos-15'

    - name: Install cargo universal2
      run: cargo install universal2
      if: matrix.os == 'macos-15'

    # windows - libheif is still needed (no native HEIF support)
    - name: Install libheif dependencies (Windows)
      if: matrix.os == 'windows-2022'
      shell: pwsh
      run: |
        vcpkg integrate install
        vcpkg install libheif:x64-windows-static-md
        vcpkg install libheif:x64-windows-static

    # macOS build (no libheif - uses native Apple ImageIO)
    - name: Build macOS
      if: matrix.os == 'macos-15'
      uses: actions-rs/cargo@v1
      with:
        use-cross: true
        command: build
        args: --verbose --release --features face_detection_insightface --target=${{ matrix.TARGET }}

    # Windows build (with libheif)
    - name: Build Windows
      if: matrix.os == 'windows-2022'
      uses: actions-rs/cargo@v1
      with:
        use-cross: true
        command: build
        args: --verbose --release --features face_detection_insightface,libheif --target=${{ matrix.TARGET }}

    # macOS
    - name: Install cargo bundle
      if: matrix.os == 'macos-15'
      run: ./build_mac.sh

    - name: Sign macOS App (Apple Developer Certificate)
      id: apple_sign
      if: matrix.os == 'macos-15' && vars.APPLE_SIGN == '1'
      env:
        APPLE_CERT_B64: ${{ secrets.APPLE_CERT_B64 }}
        APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        APPLE_ID_EMAIL: ${{ secrets.APPLE_ID_EMAIL }}
        APPLE_ID_APP_PASSWORD: ${{ secrets.APPLE_ID_APP_PASSWORD }}
      run: bash ./apple_codesign_mac.sh

    - name: Sign macOS App (Self-Signed Certificate)
      if: matrix.os == 'macos-15' && vars.APPLE_SIGN != '1'
      env:
        CERT_KEY_B64: ${{ secrets.CERT_KEY_B64 }}
        CERT_CRT_B64: ${{ secrets.CERT_CRT_B64 }}
        P12_PASS: ${{ secrets.P12_PASS }}
      run: bash ./codesign_mac.sh

    - name: Get version from tag
      if: startsWith(github.ref, 'refs/tags/v') && (matrix.os == 'macos-15' || matrix.os == 'windows-2022')
      id: get_version
      run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      shell: bash

    - name: Rename DMG with version
      if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'macos-15'
      run: mv ChamaOptics-arm64.dmg chama-optics-macos_arm64-${{ steps.get_version.outputs.version }}.dmg

    # From here only works when there's tag starting with `v`
    - name: Upload Mac Release
      if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'macos-15'
      id: upload-release-asset-mac
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.release_job.outputs.upload_url }}
        asset_path: chama-optics-macos_arm64-${{ steps.get_version.outputs.version }}.dmg
        asset_name: chama-optics-macos_arm64-${{ steps.get_version.outputs.version }}.dmg
        asset_content_type: application/octet-stream

    # Save notarization info for Phase 2 workflow (Apple signing only)
    - name: Upload notarization submission ID
      if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'macos-15' && vars.APPLE_SIGN == '1'
      uses: actions/upload-artifact@v4
      with:
        name: notarization-info
        path: |
          notarization_submission_id.txt
        retention-days: 7

    # Save app bundle for stapling in Phase 2 (Apple signing only)
    - name: Upload app bundle for stapling
      if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'macos-15' && vars.APPLE_SIGN == '1'
      uses: actions/upload-artifact@v4
      with:
        name: app-bundle
        path: target/release/bundle/osx/Chama Optics.app
        retention-days: 7

    # windows
    - name: Create Windows zip package
      if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'windows-2022'
      shell: pwsh
      run: |
        Compress-Archive -Path "target/x86_64-pc-windows-msvc/release/chama-optics.exe" -DestinationPath "chama-optics-win_x86_64-${{ steps.get_version.outputs.version }}.zip"

    - name: Upload Windows 2022 Release zip
      if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'windows-2022'
      id: upload-release-asset-windows-classic
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.release_job.outputs.upload_url }}
        asset_path: chama-optics-win_x86_64-${{ steps.get_version.outputs.version }}.zip
        asset_name: chama-optics-win_x86_64-${{ steps.get_version.outputs.version }}.zip
        asset_content_type: application/zip

    # Save cache even if the build fails (always runs)
    - name: Save logo assets cache
      if: always() && steps.cache-logo-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: assets/download
        key: logo-assets-${{ hashFiles('assets/logo_mnf.csv') }}-complete

  publish_release:
    name: Publish release
    needs: [build_job, release_job]
    runs-on: ubuntu-24.04
    # Skip auto-publish when Apple signing is enabled (Phase 2 will publish after stapling)
    if: vars.APPLE_SIGN != '1'
    steps:
    - name: Test id
      run: echo "${{ needs.release_job.outputs.release_id }}"
    - name: Test id 2
      run: echo "${{ needs.release_job.outputs.upload_url }}"
    - name: Publish
      uses: eregon/publish-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        release_id: ${{ needs.release_job.outputs.release_id }}
