name: Web Deploy

on:
  push:
    tags:
      - 'web/v*'   # strict: failure = failure
      - 'v*'       # best-effort: failure is treated as success
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time
concurrency:
  group: "pages"
  cancel-in-progress: false

# TODO: Re-enable -D warnings after fixing WASM-specific warnings
#       (unused desktop-only imports/functions behind cfg gates, deprecated web_sys methods)
# env:
#   RUSTFLAGS: -D warnings
#   RUSTDOCFLAGS: -D warnings

jobs:
  build:
    name: Build WASM
    runs-on: ubuntu-24.04
    # web/v* tags : strict — failure is a real failure
    # v*     tags : best-effort — failure does NOT block the release tag
    # branches/PRs: strict
    continue-on-error: ${{ startsWith(github.ref, 'refs/tags/v') && !startsWith(github.ref, 'refs/tags/web/') }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: 1.92
          override: true
          target: wasm32-unknown-unknown

      - name: Install protoc (required by candle-onnx)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Trunk
        run: |
          TRUNK_VERSION="0.21.14"
          wget -qO- "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" | tar xzf -
          chmod +x trunk
          sudo mv trunk /usr/local/bin/

      - name: Force zune-jpeg version to avoid 0.5.6 bug
        run: cargo update -p zune-jpeg:0.5.6 --precise 0.5.8 || true

      - name: Inject or remove Google Analytics
        env:
          GA_ID: ${{ secrets.GA_MEASUREMENT_ID }}
        run: |
          if [ -n "$GA_ID" ]; then
            sed -i "s/%%GA_MEASUREMENT_ID%%/$GA_ID/g" index.html
          else
            sed -i '/<!-- GA:BEGIN/,/<!-- GA:END -->/d' index.html
          fi

      - name: Build with Trunk
        run: trunk build --release --public-url /chama-optics/

      - name: Upload Pages artifact
        if: startsWith(github.ref, 'refs/tags/web/') || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    # Deploy on web/v* tags (strict) and v* tags (best-effort)
    if: startsWith(github.ref, 'refs/tags/web/') || startsWith(github.ref, 'refs/tags/v')
    # v* non-web tags: deploy failure is non-blocking
    continue-on-error: ${{ startsWith(github.ref, 'refs/tags/v') && !startsWith(github.ref, 'refs/tags/web/') }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
