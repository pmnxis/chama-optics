name: Manual Upload Logo Assets

on:
  workflow_dispatch:  # Manual trigger only
    inputs:
      download_url:
        description: 'Raw URL from private GitHub Gist (must end with /raw/...)'
        required: true

jobs:
  download-and-cache:
    name: Download and cache logo assets
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-2022]
    steps:
      - uses: actions/checkout@v4

      - name: Download logo assets from GitHub Gist
        shell: bash
        run: |
          echo "Downloading from: ${{ inputs.download_url }}"
          curl -L "${{ inputs.download_url }}" -o logo-assets.tar.gz.b64

          echo "Decoding base64..."
          base64 -d logo-assets.tar.gz.b64 > logo-assets.tar.gz

          echo "Extracting archive..."
          mkdir -p assets
          tar xzf logo-assets.tar.gz -C assets/

      - name: Verify logo files
        shell: bash
        run: |
          echo "=== Downloaded Logo Files ==="
          if [ -d "assets/download" ]; then
            ls -lah assets/download/
            echo ""
            echo "Total files:"
            find assets/download -type f | wc -l
            echo ""
            echo "Total size:"
            du -sh assets/download/
          else
            echo "ERROR: assets/download not found!"
            exit 1
          fi

      - name: Save to cache
        uses: actions/cache/save@v4
        with:
          path: assets/download
          key: logo-assets-${{ hashFiles('assets/logo_mnf.csv') }}-complete
