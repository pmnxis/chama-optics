<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Chama Optics - Photo EXIF editor and frame creator">
    <title>Chama Optics</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/mac-icon.png">

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 24px;
            z-index: 9999;
        }

        #loading .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #loading .message {
            margin-top: 10px;
            font-size: 16px;
            opacity: 0.9;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #the_canvas_id {
            opacity: 0;
            transition: opacity 0.5s;
        }

        #the_canvas_id.loaded {
            opacity: 1;
        }

        /* Error display */
        .error {
            color: #ff6b6b;
            padding: 20px;
            margin: 20px;
            border: 2px solid #ff6b6b;
            border-radius: 8px;
            background: rgba(255, 107, 107, 0.1);
            text-align: center;
        }

        .error ul {
            text-align: left;
            display: inline-block;
        }
    </style>
</head>

<body>
    <div id="loading">
        <div class="spinner"></div>
        <div>Loading Chama Optics...</div>
        <div class="message">Initializing WASM module</div>
    </div>

    <!-- Canvas for egui -->
    <canvas id="the_canvas_id"></canvas>

    <!-- Trunk will inject the WASM bundle here -->
    <link data-trunk rel="rust" data-bin="chama-optics" data-cargo-features="web" data-cargo-no-default-features />

    <script>
        // Check WebGL support first
        function checkWebGLSupport() {
            const testCanvas = document.createElement('canvas');
            const gl = testCanvas.getContext('webgl') || testCanvas.getContext('webgl2') || testCanvas.getContext('experimental-webgl');

            if (!gl) {
                const loadingElement = document.getElementById('loading');
                if (loadingElement) {
                    loadingElement.innerHTML = `
                        <div class="error">
                            <h2>WebGL Not Supported</h2>
                            <p>Your browser does not support WebGL, which is required for Chama Optics.</p>
                            <p><strong>Solutions:</strong></p>
                            <ul>
                                <li>Update your browser to the latest version</li>
                                <li>Enable WebGL in browser settings</li>
                                <li>Try Chrome, Firefox, Edge, or Safari</li>
                                <li>Enable hardware acceleration</li>
                            </ul>
                            <p style="margin-top: 20px;">
                                <a href="https://get.webgl.org/" target="_blank" style="color: white;">
                                    Test WebGL Support
                                </a>
                            </p>
                        </div>
                    `;
                }
                return false;
            }
            console.log('WebGL is supported');
            return true;
        }

        // Wait for WASM initialization
        function waitForInit() {
            const loadingElement = document.getElementById('loading');
            const canvas = document.getElementById('the_canvas_id');

            // Simple timeout - remove loading screen after 2 seconds
            setTimeout(() => {
                console.log('Removing loading screen');
                if (loadingElement) {
                    loadingElement.style.opacity = '0';
                    setTimeout(() => {
                        loadingElement.style.display = 'none';
                    }, 500);
                }

                if (canvas) {
                    canvas.classList.add('loaded');
                    console.log('Canvas displayed');
                }
            }, 2000);
        }

        // Initialize on page load
        window.addEventListener('load', () => {
            console.log('Page loaded, checking WebGL...');
            if (checkWebGLSupport()) {
                waitForInit();
            }
        });

        // Error handling
        window.addEventListener('error', (e) => {
            console.error('Error:', e);
            const loadingElement = document.getElementById('loading');
            if (loadingElement) {
                const errorMsg = e.message || 'Unknown error';
                if (errorMsg.includes('WebGL')) {
                    loadingElement.innerHTML = `
                        <div class="error">
                            <h2>WebGL Error</h2>
                            <p>${errorMsg}</p>
                            <p>Your browser or graphics driver may not support WebGL.</p>
                            <p>Try updating your graphics drivers or using a different browser.</p>
                        </div>
                    `;
                } else {
                    loadingElement.innerHTML = `
                        <div class="error">
                            <h2>Failed to Load</h2>
                            <p>${errorMsg}</p>
                            <p>Press F12 to open console for more details</p>
                        </div>
                    `;
                }
            }
        });

        console.log('Chama Optics initializing...');
    </script>
</body>

</html>
