[package]
name = "chama-optics"
version = "0.2.0-rc3"
description = "The tool load and save photo quickly considering EXIF and user preset"
authors = ["Jinwoo Park <pmnxis@gmail.com>"]
repository = "https://github.com/pmnxis/chama-optics"
edition = "2024"
include = ["LICENSE-NON-AI-MIT", "**/*.rs", "Cargo.toml"]
rust-version = "1.92"

# iOS library configuration
[lib]
name = "chama_optics"
crate-type = ["cdylib", "rlib", "staticlib"]

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

[package.metadata.bundle]
name = "Chama Optics"
icon = ["chama-optics-x256.ico", "assets/mac-icon.png"]
identifier = "com.github.pmnxis.chamaoptics"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(has_logo_asset_path)',
    'cfg(has_insightface_model)',
    'cfg(target_os)',
] }

[features]
default = ["desktop"]
desktop = [
    "egui",
    "eframe",
    "rfd",
    "egui-file-dialog",
    "sys-locale",
    "font-kit",
    "dep:reqwest",
    "native_encoders",
    "threading",
    "dep:clap",
    "dep:env_logger",
    "dep:dirs",
    "dep:sha2",
    # Note: ext_res removed from default
    # macOS: Use --features "desktop,ext_res" (recommended for notarization)
    # Windows/Linux: Use default (fonts/models embedded in binary)
]
# Web/WASM target — full GUI via eframe WebGL, no native I/O
web = [
    "egui",
    "eframe",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
    "dep:js-sys",
]
# Native image encoders (mozjpeg, webp, oxipng) — C FFI, desktop only
native_encoders = ["dep:mozjpeg", "dep:webp", "dep:oxipng"]
# Threading support (rayon, num_cpus) — not available on WASM
threading = ["dep:rayon", "dep:num_cpus"]
# libheif for Windows/Linux desktop (macOS/iOS use native Apple ImageIO)
libheif = ["libheif-rs"]
# Statically link libheif from bundled sources (no system libheif required).
# Use: --features "desktop,libheif,embedded_libheif"
# Note: macOS/iOS use native ImageIO — embedded cmake build is skipped there
# automatically because libheif-sys is declared only in non-Apple target deps.
embedded_libheif = ["dep:libheif-sys"]
# iOS-specific features (Photos library, Share extension) - core library only, no GUI
ios_integration = ["metal_integration", "face_detection_visionkit", "dep:dirs", "dep:env_logger"]
# Android-specific features - core library only, no Metal/VisionKit
# egui is needed for types (Color32, Vec2) used in themes/effects, not for GUI
android_integration = ["egui", "dep:dirs"]
# Disable logging - for Xcode Release/TestFlight builds (logging enabled by default for Debug)
disable_logging = ["log/max_level_off", "log/release_max_level_off"]
# Theme support for iOS (without egui GUI dependencies) - not currently used
theme_ios = ["egui"]
# Metal rendering for iOS/macOS integration
metal_rendering = ["egui", "wgpu", "egui-wgpu", "swift-bridge", "futures"]
# Metal-based FFI for iOS/macOS (path-based fonts, no egui GUI, but needs egui types)
metal_integration = ["egui"]
face_detection_visionkit = []

# ext_res: Load fonts/models from Resources/ directory
#   - Recommended for macOS (reduces binary size by ~40MB for notarization)
#   - Optional for Windows/Linux
#   - Fonts/models must be in Contents/Resources/{Fonts,Models,Logos}/
#   - Enable with: --features "desktop,ext_res"
ext_res = []

# InsightFace face detection (all platforms)
# Linux: build-linux.sh auto-selects ort rc.10/rc.11 based on glibc version
face_detection_insightface = [
    "candle-core",
    "candle-nn",
    "half",
    "ndarray",
    "ort",
]
# Candle-based face detection (WASM + cross-platform, no ort/C++ dependency)
# Uses candle-onnx for ONNX inference — works on wasm32, macOS, Linux
face_detection_candle = [
    "candle-core",
    "candle-nn",
    "dep:candle-onnx",
    "dep:prost",
]
build_assets = []

[dependencies]
chama-optics-macros = { path = "macros" }
wgpu = { version = "27.0.1", optional = true }
egui-wgpu = { git = "https://github.com/pmnxis/egui", rev = "ac14c7d289be4a382751afece4687c292615a767", optional = true }
swift-bridge = { version = "0.1", optional = true }
futures = { version = "^0.3", optional = true }
egui = { git = "https://github.com/pmnxis/egui", rev = "ac14c7d289be4a382751afece4687c292615a767", optional = true, features = [
    "serde",
] }
## eframe: platform-specific features are added in [target] sections below
# Logging: enabled by default, disabled with disable_logging feature
log = "0.4.29"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
exif = { git = "https://github.com/pmnxis/exif-rs", rev = "c6f30cbca14d8d31e1aa7ed66e0b2d2cf7d0d73c", features = [
    "make_note",
    "mpf",
] }
image = { version = "0.25.9", features = ["serde"] }
rfd = { version = "0.17.2", optional = true }
egui-file-dialog = { version = "0.12.0", optional = true }
imageproc = { version = "0.26" }
anyhow = "^1.0"
thiserror = "^2"
ab_glyph = "0.2.32"
fast_image_resize = "^6.0"
lazy_static = "1.5.0"
gcd = "2.3.0"
env_logger = { version = "0.11.9", optional = true }
web-time = "1"
rust-i18n = "3.1.5"
uuid = { version = "1.21", features = ["v4", "serde"] }
strum = { version = "0.27.2", features = ["std", "derive"] }
strum_macros = "0.27.2"
sys-locale = { version = "0.3.2", optional = true }
dirs = { version = "6.0", optional = true }
num-traits = "0.2.19"
clap = { version = "4.5.60", features = ["derive"], optional = true }
chrono = { version = "^0.4", features = ["serde"] }
resvg = "^0.47"
tiny-skia = "^0.12"
rand = "^0.10"
rayon = { version = "1.11", optional = true }
num_cpus = { version = "1.16", optional = true }
ndarray = { version = "0.17", optional = true }
reqwest = { version = "^0.13", optional = true, features = [
    "gzip",
    "blocking",
    "json",
    # "rustls-tls",
] } # rustls is now the default TLS backend, instead of native-tls. Desktop only (update checker).

mozjpeg = { version = "0.10.13", optional = true }
webp = { version = "0.3.1", optional = true }
img-parts = "0.4"
oxipng = { version = "^10", optional = true }
libheif-rs = { version = "^2.6", default-features = false, features = [
    "v1_18",
], optional = true }
font-kit = { git = "https://github.com/pmnxis/font-kit", rev = "1ca5612b779c5707eca06c6c13a168b392a3199a", optional = true }

# ONNX Runtime for face detection
# macOS/iOS: Works perfectly with VisionKit
# Windows/macOS: Uses rc.11 (default)
# Linux: build-linux.sh auto-downgrades to rc.10 when glibc < 2.38
#   rc.11 bundles ONNX Runtime 1.21 (built on glibc 2.39, needs __isoc23_strtol@GLIBC_2.38)
#   rc.10 bundles ONNX Runtime 1.20 (compatible with glibc 2.34+)
#   See: https://github.com/pykeio/ort/issues/523
ort = { version = ">=2.0.0-rc.10, <=2.0.0-rc.11", optional = true }

sha2 = { version = "0.10", optional = true }

# LUT SYSTEM
wagahai_lut = "0.1.0"

# eframe: native desktop (glow + wayland/x11)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { git = "https://github.com/pmnxis/egui", rev = "ac14c7d289be4a382751afece4687c292615a767", default-features = false, features = [
    "glow",
    "persistence",
    "wayland",
    "x11",
], optional = true }

# eframe: WASM (glow only, no platform windowing)
[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { git = "https://github.com/pmnxis/egui", rev = "ac14c7d289be4a382751afece4687c292615a767", default-features = false, features = [
    "glow",
    "persistence",
], optional = true }
# WASM randomness support
getrandom = { version = "0.4", features = ["wasm_js"] }
uuid = { version = "1.21", features = ["v4", "serde", "js"] }

wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "Window",
    "Document",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlCanvasElement",
    "HtmlAnchorElement",
    "File",
    "FileList",
    "FileReader",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "DragEvent",
    "DataTransfer",
    "Navigator",
    "Event",
] }
js-sys = { version = "0.3", optional = true }
# zip for WASM bulk export (create zip in memory → browser download)
zip = { version = ">=8.1", default-features = false, features = ["deflate"] }

# libheif-sys with embedded cmake build — Windows/Linux only.
# macOS/iOS use native ImageIO; Android uses system libraries via JNI.
# The embedded cmake build conflicts with system codec libs (e.g. SVT-AV1 API
# changes) and is never needed on Apple/Android platforms.
[target.'cfg(not(any(target_os = "macos", target_os = "ios", target_os = "android", target_arch = "wasm32")))'.dependencies]
libheif-sys = { version = "^5", optional = true, default-features = false, features = ["embedded-libheif"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"

[target.'cfg(not(windows))'.dependencies]
candle-core = { version = "0.9", optional = true }
candle-nn = { version = "0.9", optional = true }
candle-onnx = { version = "0.9", optional = true }
half = { version = "2.4", optional = true, default-features = false }
prost = { version = "0.14", optional = true }

[profile.release]
opt-level = 3
lto = "fat"
debug = false
strip = true
codegen-units = 1

[profile.dev.package."libheif-rs"]
opt-level = 3
[profile.dev.package."ab_glyph"]
opt-level = 3
[profile.dev.package."fast_image_resize"]
opt-level = 3
# mozjpeg and webp are optional (native_encoders feature), but optimize when present
[profile.dev.package."mozjpeg-sys"]
opt-level = 3
[profile.dev.package."webp"]
opt-level = 3

[dev-dependencies]

[profile.test]
inherits = "dev"
opt-level = 0
debug = true
lto = true

[profile.test.package."*"]
opt-level = 2

[patch.crates-io]

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.build-dependencies]
swift-bridge-build = "0.1"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
reqwest = { version = "^0.13", features = [
    "gzip",
    "blocking",
    "json",
    # "rustls-tls",
] }
zip = { version = ">=8.1" }
md-5 = "0.10.6"
cargo_metadata = "0.23"
csv = "1.4"
chrono = { version = "^0.4", features = ["serde"] }
