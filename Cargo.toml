[package]
name = "chama-optics"
version = "0.1.8-alpha"
description = "The tool load and save photo quickly considering EXIF and user preset"
authors = ["Jinwoo Park <pmnxis@gmail.com>"]
repository = "https://github.com/pmnxis/chama-optics"
edition = "2024"
include = ["LICENSE-NON-AI-MIT", "**/*.rs", "Cargo.toml"]
rust-version = "1.92"

# iOS library configuration
[lib]
name = "chama_optics"
crate-type = ["cdylib", "rlib", "staticlib"]

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

[package.metadata.bundle]
# this related to `target/release/bundle/osx/{name}.app`
name = "Chama Optics"
icon = ["chama-optics-x256.ico", "assets/mac-icon.png"]
identifier = "com.github.pmnxis.chamaoptics"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(has_logo_asset_path)', 'cfg(target_os)', 'cfg(mobile_ui)'] }

[features]
default = ["desktop"]
# Desktop features with GUI
desktop = ["egui", "eframe", "rfd", "egui-file-dialog", "sys-locale", "libheif-rs"]
# Mobile UI optimizations (larger touch targets, simplified layouts)
mobile_ui = []
# iOS-specific features (Photos library, Share extension) - minimal deps, no GUI
ios_integration = ["mobile_ui"]

[dependencies]
# egui = "^0.33.3"
# 661d5f917392e88b34e00b26ab92d5accd9c6cb9 = https://github.com/emilk/egui/pull/7790 + 1.88->1.92
egui = { git = "https://github.com/emilk/egui", rev = "661d5f917392e88b34e00b26ab92d5accd9c6cb9", optional = true }
# eframe = { version = "^0.33.3", default-features = false, features = [
eframe = { git = "https://github.com/emilk/egui", rev = "661d5f917392e88b34e00b26ab92d5accd9c6cb9", default-features = false, features = [
    # "accesskit",     # Make egui compatible with screen readers. NOTE: adds a lot of dependencies.
    "default_fonts", # Embed the default egui fonts.
    "glow",          # Use the glow rendering backend. Alternative: "wgpu".
    "persistence",   # Enable restoring app state when restarting the app.
    "wayland",       # To support Linux (and CI)
    "x11",           # To support older Linux distributions (restores one of the default features),
    # "winit",
], optional = true }
log = "0.4.29"

# You only need serde if you want app persistence:
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
# todo - replace to 0.6.2 or 0.7 when once released (https://github.com/kamadak/exif-rs/pull/51)
exif = { git = "https://github.com/pmnxis/exif-rs", rev = "c6f30cbca14d8d31e1aa7ed66e0b2d2cf7d0d73c", features = [
    "make_note",
    "mpf",
] }
# kamadak-exif = "0.6.1"
image = { version = "0.25.9", features = ["serde"] }
# zune-jpeg 0.5.6 has critical bugs, force version to 0.5.7 or below
zune-jpeg = "0.5.8"
base64 = "0.22.1"
rfd = { version = "0.16.0", optional = true }
egui-file-dialog = { version = "0.12.0", optional = true }
imageproc = "0.25"
anyhow = "1.0"
ab_glyph = "0.2.32"
fast_image_resize = "5.4.0"
lazy_static = "1.5.0"
gcd = "2.3.0"
env_logger = "0.11.8"
# todo - nasm_simd and neon feature later on mozjpeg
rust-i18n = "3.1.5"
mozjpeg = { version = "0.10.13" }
webp = "0.3.1"
oxipng = "10"
strum = { version = "0.27.2", features = ["std", "derive"] }
strum_macros = { version = "0.27.2" }
sys-locale = { version = "0.3.2", optional = true }
libheif-rs = { version = "2.5", default-features = false, features = ["v1_18"], optional = true }
dirs = "6.0"
num-traits = "0.2.19"
clap = { version = "4.5.53", features = ["derive"] }
chrono = { version = "0.4.42", features = ["serde"] }
font-kit = "0.14.3"
resvg = "0.45.1"
tiny-skia = "0.11.4"
rayon = "1.10"
num_cpus = "1.16"

reqwest = { version = "0.12.28", features = [
    "gzip",
    "blocking",
    "rustls-tls",
    "json",
], default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
debug = false
strip = true
codegen-units = 1
# panic = "abort"

# Optimize all dependencies even in debug builds:
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package."libheif-rs"]
opt-level = 3
[profile.dev.package."ab_glyph"]
opt-level = 3
[profile.dev.package."fast_image_resize"]
opt-level = 3
[profile.dev.package."mozjpeg"]
opt-level = 3
[profile.dev.package."webp"]
opt-level = 3


# Test specific operation
[profile.test]
inherits = "dev"
opt-level = 0
debug = true
lto = true

[profile.test.package."*"]
opt-level = 2


[patch.crates-io]
# If you want to use the bleeding edge version of egui and eframe:
# egui = { git = "https://github.com/emilk/egui", branch = "master" }
# eframe = { git = "https://github.com/emilk/egui", branch = "master" }

# If you fork https://github.com/emilk/egui you can test with:
# egui = { path = "../egui/crates/egui" }
# eframe = { path = "../egui/crates/eframe" }

[build-dependencies]
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12.26", features = [
    "gzip",
    "blocking",
    "rustls-tls",
], default-features = false }
zip = "7.0.0"
md-5 = "0.10.6"
cargo_metadata = "0.23"
winres = "0.1"
csv = "1.4"
chrono = { version = "0.4.42", features = ["serde"] }
