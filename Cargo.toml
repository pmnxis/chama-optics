[package]
name = "chama-optics"
version = "0.2.0-rc"
description = "The tool load and save photo quickly considering EXIF and user preset"
authors = ["Jinwoo Park <pmnxis@gmail.com>"]
repository = "https://github.com/pmnxis/chama-optics"
edition = "2024"
include = ["LICENSE-NON-AI-MIT", "**/*.rs", "Cargo.toml"]
rust-version = "1.92"

# iOS library configuration
[lib]
name = "chama_optics"
crate-type = ["cdylib", "rlib", "staticlib"]

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

[package.metadata.bundle]
name = "Chama Optics"
icon = ["chama-optics-x256.ico", "assets/mac-icon.png"]
identifier = "com.github.pmnxis.chamaoptics"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(has_logo_asset_path)',
    'cfg(has_insightface_model)',
    'cfg(target_os)',
] }

[features]
default = ["desktop"]
desktop = [
    "egui",
    "eframe",
    "rfd",
    "egui-file-dialog",
    "sys-locale",
    "font-kit",
    "reqwest",
    "zip",
    # Note: ext_res removed from default
    # macOS: Use --features "desktop,ext_res" (recommended for notarization)
    # Windows/Linux: Use default (fonts/models embedded in binary)
]
# libheif for Windows/Linux desktop (macOS/iOS use native Apple ImageIO)
libheif = ["libheif-rs"]
# iOS-specific features (Photos library, Share extension) - core library only, no GUI
ios_integration = ["metal_integration", "face_detection_visionkit"]
# Android-specific features - core library only, no Metal/VisionKit
# egui is needed for types (Color32, Vec2) used in themes/effects, not for GUI
android_integration = ["egui"]
# Disable logging - for Xcode Release/TestFlight builds (logging enabled by default for Debug)
disable_logging = ["log/max_level_off", "log/release_max_level_off"]
# Theme support for iOS (without egui GUI dependencies) - not currently used
theme_ios = ["egui"]
# Metal rendering for iOS/macOS integration
metal_rendering = ["egui", "wgpu", "egui-wgpu", "swift-bridge", "futures"]
# Metal-based FFI for iOS/macOS (path-based fonts, no egui GUI, but needs egui types)
metal_integration = ["egui"]
face_detection_visionkit = []

# ext_res: Load fonts/models from Resources/ directory
#   - Recommended for macOS (reduces binary size by ~40MB for notarization)
#   - Optional for Windows/Linux
#   - Fonts/models must be in Contents/Resources/{Fonts,Models,Logos}/
#   - Enable with: --features "desktop,ext_res"
ext_res = []

# InsightFace face detection - macOS/iOS ONLY
# WARNING: This feature is broken on Windows/Linux due to fundamental
# ONNX Runtime C++ stdlib ABI issues. Do not use on Windows/Linux.
face_detection_insightface = [
    "candle-core",
    "candle-nn",
    "half",
    "ndarray",
    "ort",
]
build_assets = []

[dependencies]
chama-optics-macros = { path = "macros" }
wgpu = { version = "27.0.1", optional = true }
egui-wgpu = { git = "https://github.com/pmnxis/egui", rev = "ac14c7d289be4a382751afece4687c292615a767", optional = true }
swift-bridge = { version = "0.1", optional = true }
futures = { version = "^0.3", optional = true }
egui = { git = "https://github.com/pmnxis/egui", rev = "ac14c7d289be4a382751afece4687c292615a767", optional = true, features = [
    "serde",
] }
eframe = { git = "https://github.com/pmnxis/egui", rev = "ac14c7d289be4a382751afece4687c292615a767", default-features = false, features = [
    # "default_fonts",  # Removed: Use external fonts with ext_res feature or embedded fonts without it
    "glow",
    "persistence",
    "wayland",
    "x11",
], optional = true }
# Logging: enabled by default, disabled with disable_logging feature
log = "0.4.29"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
exif = { git = "https://github.com/pmnxis/exif-rs", rev = "c6f30cbca14d8d31e1aa7ed66e0b2d2cf7d0d73c", features = [
    "make_note",
    "mpf",
] }
image = { version = "0.25.9", features = ["serde"] }
zune-jpeg = "0.5.12"
base64 = "0.22.1"
rfd = { version = "0.17.2", optional = true }
egui-file-dialog = { version = "0.12.0", optional = true }
imageproc = { version = "0.26" }
anyhow = "^1.0"
ab_glyph = "0.2.32"
fast_image_resize = "^6.0"
lazy_static = "1.5.0"
gcd = "2.3.0"
env_logger = "0.11.9"
android_logger = "0.15"
rust-i18n = "3.1.5"
uuid = { version = "1.21", features = ["v4", "serde"] }
strum = { version = "0.27.2", features = ["std", "derive"] }
strum_macros = "0.27.2"
sys-locale = { version = "0.3.2", optional = true }
dirs = "6.0"
num-traits = "0.2.19"
clap = { version = "4.5.58", features = ["derive"] }
chrono = { version = "^0.4", features = ["serde"] }
resvg = "^0.47"
tiny-skia = "^0.12"
rand = "^0.10"
rayon = "1.11"
num_cpus = "1.16"
ndarray = { version = "0.17", optional = true }
reqwest = { version = "^0.13", optional = true, features = [
    "gzip",
    "blocking",
    "json",
    # "rustls-tls",
] } # rustls is now the default TLS backend, instead of native-tls. Desktop only (update checker).

mozjpeg = { version = "0.10.13" }
webp = "0.3.1"
oxipng = "^10"
libheif-rs = { version = "^2.6", default-features = false, features = [
    "v1_18",
], optional = true }
font-kit = { git = "https://github.com/pmnxis/font-kit", rev = "1ca5612b779c5707eca06c6c13a168b392a3199a", optional = true }

# ONNX Runtime for face detection
# macOS/iOS: Works perfectly with VisionKit
# Windows: Trying ort 2.0.0-rc.10 (older version may have better ABI compatibility)
# Linux: Currently broken due to C++ stdlib ABI issues
ort = { git = "https://github.com/pykeio/ort", version = "2.0.0-rc.11", optional = true }

# LUT SYSTEM
wagahai_lut = "0.1.0"

[target.'cfg(not(windows))'.dependencies]
candle-core = { version = "0.9", optional = true }
candle-nn = { version = "0.9", optional = true }
half = { version = "2.4", optional = true, default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
debug = false
strip = true
codegen-units = 1

[profile.dev.package."libheif-rs"]
opt-level = 3
[profile.dev.package."ab_glyph"]
opt-level = 3
[profile.dev.package."fast_image_resize"]
opt-level = 3
[profile.dev.package."mozjpeg"]
opt-level = 3
[profile.dev.package."webp"]
opt-level = 3

[profile.test]
inherits = "dev"
opt-level = 0
debug = true
lto = true

[profile.test.package."*"]
opt-level = 2

[patch.crates-io]

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.build-dependencies]
swift-bridge-build = "0.1"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
reqwest = { version = "^0.13", optional = true, features = [
    "gzip",
    "blocking",
    "json",
    # "rustls-tls",
] }
zip = { version = ">=8.0", optional = true }
md-5 = "0.10.6"
cargo_metadata = "0.23"
csv = "1.4"
chrono = { version = "^0.4", features = ["serde"] }
