# Typos configuration for chama-optics

[default.extend-words]
egui = "egui"
chama = "chama"
haachama = "haachama"

# Indonesian language words
Tema = "Tema"           # Theme
Sistem = "Sistem"       # System
sistem = "sistem"       # system (lowercase)
mis = "mis"             # abbreviation for "misalnya" (for example, e.g.)
foto = "foto"           # photo
Foto = "Foto"           # Photo
Absolut = "Absolut"     # Absolute
Blok = "Blok"           # Block
blok = "blok"           # block (lowercase)
Variabel = "Variabel"   # Variable
variabel = "variabel"   # variable (lowercase)
Standar = "Standar"     # Standard
standar = "standar"     # standard (lowercase)
vertikal = "vertikal"   # vertical
grup = "grup"           # group
Faktor = "Faktor"       # Factor

# Technical terms
wdth = "wdth"           # Font variable axis for width
wght = "wght"           # Font variable axis for weight
iy = "iy"               # intersection y-coordinate variable prefix (iy1, iy2)

[files]
# Optionally ignore specific files if needed
# extend-exclude = []
