# Trunk configuration for WASM builds
# Build: trunk build --release
# Serve: trunk serve --open

[build]
target = "index.html"
filehash = false

[watch]
ignore = ["dist", "target", "bak"]

# Skip wasm-opt optimization — avoids SIMD validation issues.
# Rust already generates optimized WASM.
[tools]
wasm-opt = false

# Stage all font files into web_fonts/ before Trunk captures copy-dir contents.
[[hooks]]
stage = "pre_build"
command = "sh"
command_arguments = ["scripts/prepare_web_fonts.sh"]
