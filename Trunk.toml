# Trunk configuration for WASM builds
# Build: trunk build --release
# Serve: trunk serve --open

[build]
target = "index.html"
filehash = false

[watch]
ignore = ["dist", "target", "bak"]

# Skip wasm-opt optimization — avoids SIMD validation issues.
# Rust already generates optimized WASM.
[tools]
wasm-opt = false

# Ensure web_fonts/ exists before cargo build.
# build.rs populates this directory with font files during compilation.
[[hooks]]
stage = "pre_build"
command = "mkdir"
command_arguments = ["-p", "web_fonts"]

# Copy web_fonts/ to dist/Fonts/ after build.rs has populated it.
[[hooks]]
stage = "post_build"
command = "sh"
command_arguments = ["-c", "mkdir -p dist/Fonts && cp web_fonts/* dist/Fonts/"]

