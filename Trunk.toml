# Trunk configuration for WASM builds
# Build: trunk build --release
# Serve: trunk serve --open

[build]
target = "index.html"
filehash = false

[watch]
ignore = ["dist", "target", "bak"]

# Skip wasm-opt optimization — avoids SIMD validation issues.
# Rust already generates optimized WASM.
[tools]
wasm-opt = false

# Ensure web_fonts/ exists before Trunk validates copy-dir assets.
# build.rs populates this directory with font files during cargo build.
[[hooks]]
stage = "pre_build"
command = "mkdir"
command_arguments = ["-p", "web_fonts"]

