# cbindgen configuration for Metal FFI header generation
language = "C"
cpp_compat = true

include_version = true
namespace = "chama_optics"

# Header content
header = """
/* SPDX-FileCopyrightText: © 2025 Jinwoo Park (pmnxis@gmail.com)
 * SPDX-License-Identifier: LicenseRef-Non-AI-MIT
 */

/**
 * Chama Optics Metal FFI Interface
 *
 * C API for iOS/macOS integration with path-based font loading.
 *
 * Features:
 * - EXIF preview extraction for fast loading
 * - JSON-based parameter exchange
 * - Variable font weight support (100-900)
 * - Complete EXIF metadata extraction
 *
 * All string pointers returned by this library must be freed using chama_free_string().
 */
"""

include_guard = "CHAMA_OPTICS_FFI_H"
autogen_warning = "/* Warning, this file is autogenerated by cbindgen. Don't modify this manually. */"

[export]
# Only export items from ffi_metal module
include = ["ChamaError", "ThemeConfig"]
prefix = "Chama"

[export.rename]
"ChamaError" = "ChamaError"
"ThemeConfig" = "ChamaThemeConfig"

[parse]
parse_deps = false
include = ["chama-optics"]
